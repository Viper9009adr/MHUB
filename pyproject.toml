[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "meridian-hub"
version = "0.1.0"
description = "Meridian HUB — Agentic CLI with LLM provider integration, gRPC streaming, and Redis pub/sub"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
"fastapi>=0.110.0",
"uvicorn>=0.29.0",
"grpcio>=1.62.0",
"grpcio-tools>=1.62.0",
"redis>=5.0.0",
"asyncpg>=0.29.0",
"httpx>=0.27.0",
"pydantic>=2.6.0",
"msgpack>=1.0.7",
"python-dotenv>=1.0.0",
"textual>=0.61.0",
"mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "fakeredis>=2.21.0",
    "grpcio-testing>=1.62.0",
    "testcontainers>=4.0.0",
]

[project.scripts]
meridian = "src.agentic_cli.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
