syntax = "proto3";

package meridian.hub.v1;

message CreateHubRequest {
  string workspace_id = 1;
  string initiator = 2;
}

message CreateHubResponse {
  string hub_id = 1;
  int64 created_at = 2;
}

message TerminateHubRequest {
  string hub_id = 1;
  string reason = 2;
}

message TerminateHubResponse {
  bool ok = 1;
}

message JoinHubRequest {
  string hub_id = 1;
  string member_id = 2;
  string event = 3;
}

message JoinHubEvent {
  string hub_id = 1;
  string member_id = 2;
  string event = 3;
  int64 at = 4;
}

message TapHubRequest {
  string hub_id = 1;
  int32 limit = 2;
}

message TapHubResponse {
  repeated JoinHubEvent events = 1;
}

message CreateCheckpointRequest {
  string hub_id = 1;
  string label = 2;
}

message CreateCheckpointResponse {
  string checkpoint_id = 1;
}

message RollbackCheckpointRequest {
  string hub_id = 1;
  string checkpoint_id = 2;
}

message RollbackCheckpointResponse {
  bool ok = 1;
}

message HubStatusRequest {
  string hub_id = 1;
}

message HubStatusResponse {
  string hub_id = 1;
  string state = 2;
  int64 updated_at = 3;
}

message ForkScenario {
  string fork_id = 1;
  string parent_hub_id = 2;
  string divergence_type = 3;
  string divergence_reason = 4;
  string hal_agent_id = 5;
  int64 detected_at = 6;
  string status = 7;
  bytes divergence_payload = 8;
}

message DetectForkRequest {
  string parent_hub_id = 1;
  string hal_agent_id = 2;
  string divergence_type = 3;
  string divergence_reason = 4;
  bytes divergence_payload = 5;
}

message DetectForkResponse {
  string fork_id = 1;
  string status = 2;
}

message DecideForkRequest {
  string fork_id = 1;
  string decision = 2;
}

message DecideForkResponse {
  bool ok = 1;
  string new_hub_id = 2;
}

// --- Bidirectional streaming messages ---

message AgentMessage {
  int64 run_id = 1;
  string agent_id = 2;
  bytes payload = 3;
  int64 seq = 4;
  bool done = 5;
  string err = 6;
}

message OrchEvent {
  int64 run_id = 1;
  string type = 2;
  string status = 3;
  bytes payload = 4;
  int64 ts = 5;
}

service HubService {
  rpc CreateHub(CreateHubRequest) returns (CreateHubResponse);
  rpc TerminateHub(TerminateHubRequest) returns (TerminateHubResponse);
  rpc JoinHub(stream JoinHubRequest) returns (stream JoinHubEvent);
  rpc TapHub(TapHubRequest) returns (TapHubResponse);
  rpc CreateCheckpoint(CreateCheckpointRequest) returns (CreateCheckpointResponse);
  rpc RollbackCheckpoint(RollbackCheckpointRequest) returns (RollbackCheckpointResponse);
  rpc HubStatus(HubStatusRequest) returns (HubStatusResponse);
  rpc DetectFork(DetectForkRequest) returns (DetectForkResponse);
  rpc DecideFork(DecideForkRequest) returns (DecideForkResponse);
  rpc AgentStream(stream AgentMessage) returns (stream AgentMessage);
  rpc OrchestratorEvents(stream OrchEvent) returns (stream OrchEvent);
}
